seed = 7

[experiment]
name = "PFHedge-Official-v1"
purpose = "official-package baseline under the common Heston protocol"
market = "heston-xi03"
split = "public"
model = "ntbn"

[market]
model = "heston"
scheme = "full_truncation_euler"
S0 = 100.0
K = 100.0
v0 = 0.04
r = 0.01
kappa = 2.0
theta = 0.04
xi = 0.3
rho = -0.7
T = 1.0
N = 30
transaction_cost = 0.001
accounting = "discounted"
payoff = "european_call"

[objective]
name = "entropic_risk"
risk_aversion = 1.0
pnl_scale = 1.0
score_direction = "higher"
score_definition = "score = -entropic_risk"

[leaderboard]
name = "pfhedge-official-xi03-public"
n_paths = 100000
seed = 20260724
paths_sha256 = "cc6e5c64489edf3cd15924a8c5bb1f96a47ea59de0595d6c52249efa5b22bb5b"
allowed_uses = [
    "checkpoint_selection",
    "diagnostic_reporting",
]

[model]
name = "ntbn"
source_class = "PFHedge README NoTransactionBandNet"
inputs = [
    "log_moneyness",
    "time_to_maturity",
    "volatility",
    "previous_hedge_for_clamp_only",
]
trainable = true
architecture = "pfhedge.nn.BlackScholes center; pfhedge.nn.MultiLayerPerceptron 4x32 ReLU width net; leaky-ReLU bounds; pfhedge.nn.Clamp"

[training]
optimizer = "adam"
learning_rate = 0.001
n_epochs = 10000
paths_per_epoch = 3000
validation_interval = 200

[evaluation]
leaderboards = [
    "public",
]
save_predictions = true
private_access = false
accounting = "project discounted PnL with proportional costs"

[provenance]
package = "pfhedge"
version = "0.23.0"
wheel_path = "vendor/pfhedge-0.23.0-py3-none-any.whl"
wheel_url = "https://files.pythonhosted.org/packages/c9/d4/2e431b087fac824e04348bb17d496c9121af6d6979dce1ba04b205b50d4d/pfhedge-0.23.0-py3-none-any.whl"
wheel_sha256 = "c5fc81860c2442b0c0b5896e041b544a2893d7893b0bb959c8fa2bbbb21b2dd7"
source_repository = "https://github.com/pfnet-research/pfhedge"
dependency_install = "hash-verified wheel; uv pip install --no-deps"
official_policy_modules_unchanged = true
literal_zero_rate_limitation = "PFHedge BlackScholes and WhalleyWilmott modules use their documented zero-rate formulas; the common market has r=0.01 and evaluation remains the project's discounted accounting."
common_protocol_change = "Heston paths are generated by the project and supplied as the four documented PFHedge state features; trainable models use 10000 updates x 3000 fresh paths and public checkpoint selection."
