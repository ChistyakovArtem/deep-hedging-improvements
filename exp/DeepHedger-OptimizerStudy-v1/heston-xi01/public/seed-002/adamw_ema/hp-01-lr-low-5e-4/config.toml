seed = 2

[experiment]
name = "DeepHedger-OptimizerStudy-v1"
purpose = "guided optimizer search for the selected no-PnL mathematical-residual DeepHedger"
market = "heston-xi01"
split = "public"
variant = "adamw_ema/hp-01-lr-low-5e-4"
article_label = "adamw_ema: lr-low-5e-4"
model = "DeepHedger"
optimizer = "adamw_ema"
hp_id = 1
hp_label = "lr-low-5e-4"

[market]
model = "heston"
scheme = "full_truncation_euler"
S0 = 100.0
K = 100.0
v0 = 0.04
r = 0.01
kappa = 2.0
theta = 0.04
xi = 0.1
rho = -0.7
T = 1.0
N = 30
transaction_cost = 0.001
accounting = "discounted"
payoff = "european_call"

[objective]
name = "entropic_risk"
risk_aversion = 1.0
pnl_scale = 1.0
score_direction = "higher"
score_definition = "score = -entropic_risk"

[leaderboard]
name = "recipe-matrix-xi01-public"
n_paths = 100000
seed = 20260724
paths_sha256 = "70e62bfe2e48f03a8a07ec6c62c3d1fbae51c677d8ed2b709c66493e2c131a89"
allowed_uses = [
    "checkpoint_selection",
    "diagnostic_reporting",
]

[model]
architecture = "mlp"
feature_mode = "normalized"
feature_names = [
    "log_moneyness",
    "variance_ratio",
    "time_ratio",
    "previous_hedge",
]
time_parameterization = "shared"
hidden_dims = [
    64,
    32,
]
activation = "leaky_relu"
batch_norm = false
action_head = "delta_residual"
prediction_target = "direct"
output_initialization = "zero_last"
reference_hedge = "leland_local_vol"
reference_used = true
reference_leland_scale = 20.0
reference_no_trade_width = 0.0
reference_grid_moneyness_points = 513
reference_grid_volatility_points = 257
reference_grid_log_moneyness_min = -1.5
reference_grid_log_moneyness_max = 1.5
reference_grid_volatility_min = 0.0001
reference_grid_volatility_max = 1.0
reference_cf_n_quad = 256
reference_cf_phi_min = 1e-08
reference_cf_phi_max = 200.0
reference_cf_batch_size = 8192
n_frequencies = 16
paf_sigma = 1.0
periodic_include_linear = false

[training]
optimizer = "adamw_ema"
learning_rate = 0.0005
n_epochs = 10000
paths_per_epoch = 3000
validation_interval = 200
weight_decay = 0.0001
ema_decay = 0.99
muon_learning_rate = 0.02
muon_momentum = 0.95

[reference_selection]
selector = "best_overall"
used = true
selection_metric = "lowest entropic risk on the frozen public mathematical-delta board"
kind = "leland_local_vol"
leland_scale = 20.0
no_trade_width = 0.0
public_entropic_risk = 9.729814039984172

[evaluation]
leaderboards = [
    "public",
]
save_predictions = true
private_access = false

[provenance]
baseline_experiment = "DeepHedger-RecipeMatrix-v1"
baseline_variant = "v04-residual-best-overall"
baseline_config = "exp/DeepHedger-RecipeMatrix-v1/heston-xi01/public/seed-002/v04-residual-best-overall/config.toml"
one_factor_change = "optimizer and optimizer hyperparameters"
guided_search = "anchor followed by one-coordinate lower/higher probes"
optimizer_paper = "https://arxiv.org/abs/2604.15297"
optimizer_paper_code_commit = "c34e33152db9eea8ed4b2d742b9bef5628d71fb5"
muon_parameter_policy = "Muon on hidden Linear weights; auxiliary AdamW on output head and vector parameters"
weight_decay_policy = "decoupled for AdamW-family methods; biases and one-dimensional parameters exempt"
no_paf = true
no_running_pnl = true
private_access = false
