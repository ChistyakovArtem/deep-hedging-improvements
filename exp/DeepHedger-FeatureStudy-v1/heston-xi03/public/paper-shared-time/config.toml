seed = 0

[experiment]
name = "DeepHedger-FeatureStudy-v1"
purpose = "estimate Vanilla DH versus mathematical deltas"
market = "heston-xi03"
split = "public"
config_id = 2
variant = "paper-shared-time"
model = "DeepHedger"

[market]
model = "heston"
scheme = "full_truncation_euler"
S0 = 100.0
K = 100.0
v0 = 0.04
r = 0.01
kappa = 2.0
theta = 0.04
xi = 0.3
rho = -0.7
T = 1.0
N = 30
transaction_cost = 0.001
accounting = "discounted"
payoff = "european_call"

[objective]
name = "entropic_risk"
risk_aversion = 1.0
pnl_scale = 1.0
score_direction = "higher"
score_definition = "score = -entropic_risk"

[leaderboard]
name = "feature-study-xi03-public"
n_paths = 100000
seed = 20260724
paths_sha256 = "cc6e5c64489edf3cd15924a8c5bb1f96a47ea59de0595d6c52249efa5b22bb5b"
allowed_uses = [
    "checkpoint_selection",
    "diagnostic_reporting",
]

[model]
architecture = "mlp"
feature_mode = "paper_log_state_with_time"
feature_names = [
    "log_spot",
    "variance",
    "time_ratio",
    "previous_hedge",
]
time_parameterization = "shared"
hidden_dims = [
    16,
    16,
]
activation = "relu"
batch_norm = true
initialization = "torch-default; exact paper distributions were not disclosed"
n_frequencies = 16
paf_sigma = 1.0
periodic_include_linear = false

[training]
optimizer = "adam"
learning_rate = 0.005
n_epochs = 10000
paths_per_epoch = 256
validation_interval = 200

[evaluation]
leaderboards = [
    "public",
]
save_predictions = true
private_access = false

[provenance]
description = "Buehler et al. paper conventions with shared weights and explicit time"
paper_architecture_rule = "two hidden layers of width d+15; d=1 gives 16"
paper_training_conventions = "ReLU; batch norm before activation; Adam lr=0.005; batch=256"
common_changes_from_paper = "stock only; T=1; 10000 updates; entropic objective; full-truncation Euler"
